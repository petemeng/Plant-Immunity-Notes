<svg xmlns="http://www.w3.org/2000/svg" width="680" height="949" viewBox="0 0 680 949" role="img" aria-labelledby="title desc"><title id="title">25.1 三类共处关系，三种判断重点</title><desc id="desc">典型豆科根瘤、丛枝菌根与一般共栖的结构和收益不同。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="680" height="949" fill="#f8faf6"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#718d7d"/></marker></defs>
<text x="30" y="45" font-size="30" fill="#193a30" font-weight="700">25.1 三类共处关系，三种判断重点</text>
<text x="30" y="100.5" font-size="23" fill="#52685f" font-weight="400">典型体系的对照，不是全部植物的统一模型</text>
<rect x="26" y="161.85" width="628" height="195" rx="15" fill="#ffffff" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="198.85" font-size="26" fill="#176c55" font-weight="700">典型豆科—根瘤菌共生</text>
<text x="47" y="241.85" font-size="24" fill="#193a30" font-weight="400">形成根瘤及细胞内共生体</text>
<text x="47" y="276.85" font-size="24" fill="#193a30" font-weight="400">固定氮 → 植物；植物碳 → 微生物</text>
<text x="47" y="311.85" font-size="24" fill="#193a30" font-weight="400">有根瘤，不等于已获得有效固定氮。</text>
<rect x="26" y="378.85" width="628" height="195" rx="15" fill="#ffffff" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="415.85" font-size="26" fill="#315f91" font-weight="700">丛枝菌根（AM）</text>
<text x="47" y="458.85" font-size="24" fill="#193a30" font-weight="400">根皮层细胞形成丛枝交换界面</text>
<text x="47" y="493.85" font-size="24" fill="#193a30" font-weight="400">磷等矿质营养 → 植物；植物碳/脂质 → 真菌</text>
<text x="47" y="528.85" font-size="24" fill="#193a30" font-weight="400">有定殖，不等于植物净收益一定增加。</text>
<rect x="26" y="595.85" width="628" height="160" rx="15" fill="#ffffff" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="632.85" font-size="26" fill="#176c55" font-weight="700">一般共栖</text>
<text x="47" y="675.85" font-size="24" fill="#193a30" font-weight="400">可存在于表面或内部，不必形成专门交换结构。</text>
<text x="47" y="710.85" font-size="24" fill="#193a30" font-weight="400">关系与功能需在具体宿主和环境中评价。</text>
<text x="32" y="791.85" font-size="22" fill="#52685f" font-weight="400">“共生”一词在不同文献中有宽窄用法；本章重点讨论具有专门</text>
<text x="32" y="823.75" font-size="22" fill="#52685f" font-weight="400">宿主程序的根瘤与AM互作。</text>
<text x="32" y="887.65" font-size="22" fill="#52685f" font-weight="400">原创教学示意；具体来源与适用范围见本章图注。</text>
</svg>
