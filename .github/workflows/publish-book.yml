name: Publish Quarto Book

on:
  push:
    branches: ["main", "master"]
    paths:
      - "book/**"
      - "01-基础知识/**"
      - "02-实验技术/**"
      - "03-文献笔记/**"
      - "04-学习规划/**"
      - "05-小知识点/**"
      - "images/**"
      - "scripts/sync-notes-to-book.ps1"
      - ".github/workflows/publish-book.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Sync Obsidian notes into book
        shell: pwsh
        run: ./scripts/sync-notes-to-book.ps1

      - name: Render book
        run: quarto render book

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/_book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
