<rect x="26" y="645.85" width="628" height="125" rx="15" fill="#ffffff" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="682.85" font-size="26" fill="#176c55" font-weight="700">A与B：比值相同，变化来源不同</text>
<text x="47" y="725.85" font-size="24" fill="#193a30" font-weight="400">A的LUC增加、REN不变；B的LUC不变、REN下降。</text>
<rect x="26" y="792.85" width="628" height="160" rx="15" fill="#ffffff" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="829.85" font-size="26" fill="#315f91" font-weight="700">C与D：不能忽略两种报告都在变化</text>
<text x="47" y="872.85" font-size="24" fill="#193a30" font-weight="400">C两者均升高；D两者均降低。</text>
<text x="47" y="907.85" font-size="24" fill="#193a30" font-weight="400">D的LUC已低于基准，比值却仍为基准的2倍。</text>
<text x="32" y="988.85" font-size="22" fill="#52685f" font-weight="400">这说明要检查报告背景与参照适用性，不是说某一行自动证明</text>
<text x="32" y="1020.75" font-size="22" fill="#52685f" font-weight="400">或否定转录调控。Dual-LUC的比值不是split-LUC互补信号。</text>
<text x="32" y="1084.65" font-size="22" fill="#52685f" font-weight="400">原创教学示意；具体来源与适用范围见本章图注。</text>
</svg>
