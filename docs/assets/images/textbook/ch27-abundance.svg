<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1061" viewBox="0 0 680 1061" role="img" aria-labelledby="title desc"><title id="title">27.2 同样的比例，不同的数量变化</title><desc id="desc">参照A20其他80，情境一A20其他180，情境二A10其他90；两个情境比例都是10%，但A数量不同。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="680" height="1061" fill="#f8faf6"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#718d7d"/></marker></defs>
<text x="30" y="45" font-size="30" fill="#193a30" font-weight="700">27.2 同样的比例，不同的数量变化</text>
<text x="30" y="100.5" font-size="23" fill="#52685f" font-weight="400">虚拟算术例：所有数值均为教学构造</text>
<rect x="26" y="161.85" width="628" height="160" rx="15" fill="#ffffff" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="198.85" font-size="26" fill="#176c55" font-weight="700">参照</text>
<text x="47" y="241.85" font-size="24" fill="#193a30" font-weight="400">A = 20；其他 = 80；总量 = 100</text>
<text x="47" y="276.85" font-size="24" fill="#193a30" font-weight="400">A的比例 = 20%</text>
<rect x="26" y="343.85" width="628" height="160" rx="15" fill="#ffffff" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="380.85" font-size="26" fill="#315f91" font-weight="700">情境一：A的数量没有减少</text>
<text x="47" y="423.85" font-size="24" fill="#193a30" font-weight="400">A = 20；其他 = 180；总量 = 200</text>
<text x="47" y="458.85" font-size="24" fill="#193a30" font-weight="400">A的比例 = 10%</text>
<rect x="26" y="525.85" width="628" height="160" rx="15" fill="#ffffff" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="562.85" font-size="26" fill="#176c55" font-weight="700">情境二：A的数量减少</text>
<text x="47" y="605.85" font-size="24" fill="#193a30" font-weight="400">A = 10；其他 = 90；总量 = 100</text>
<text x="47" y="640.85" font-size="24" fill="#193a30" font-weight="400">A的比例 = 10%</text>
<rect x="26" y="707.85" width="628" height="160" rx="15" fill="#fff7e8" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="744.85" font-size="26" fill="#176c55" font-weight="700">为什么不能只看比例？</text>
<text x="47" y="787.85" font-size="24" fill="#193a30" font-weight="400">两个情境都从20%变为10%。</text>
<text x="47" y="822.85" font-size="24" fill="#193a30" font-weight="400">只有补上合适的数量尺度，才能区分A是否真的减少。</text>
<text x="32" y="903.85" font-size="22" fill="#52685f" font-weight="400">假设各样本比较单位相同；真实标记读数还受拷贝数、测量偏</text>
<text x="32" y="935.75" font-size="22" fill="#52685f" font-weight="400">差和归一化方式影响。</text>
<text x="32" y="999.65" font-size="22" fill="#52685f" font-weight="400">原创教学示意；具体来源与适用范围见本章图注。</text>
</svg>
