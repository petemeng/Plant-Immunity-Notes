<text text-anchor="middle" x="70.0" y="588.35" font-size="23" fill="#193a30" font-weight="400">D</text>
<rect x="114" y="541.85" width="135" height="76" rx="0" fill="#edf4ef" stroke="#d4e3d9" stroke-width="1"/>
<text text-anchor="middle" x="181.5" y="588.35" font-size="23" fill="#193a30" font-weight="400">500</text>
