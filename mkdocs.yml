site_name: 植物免疫学
site_description: 从基础概念到机制与证据——适合初学者的植物免疫学习书稿
site_author: Peter
site_url: https://petemeng.github.io/Plant-Immunity-Notes/
repo_url: https://github.com/petemeng/Plant-Immunity-Notes
repo_name: petemeng/Plant-Immunity-Notes

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/stylesheets/book-chapter.v2.css
  - assets/stylesheets/textbook.css

extra_javascript:
  - assets/javascripts/chapter-toc.v2.js
  - assets/javascripts/history-catalog.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

extra:
  book_revision: '2026 年 9 月 19 日'

