<svg xmlns="http://www.w3.org/2000/svg" width="680" height="965" viewBox="0 0 680 965" role="img" aria-labelledby="title desc"><title id="title">24.3 组成变化不等于菌群失衡</title><desc id="desc">稳态、群落组成改变和伴随宿主损伤的失衡需要区分。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="680" height="965" fill="#f8faf6"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#718d7d"/></marker></defs>
<text x="30" y="45" font-size="30" fill="#193a30" font-weight="700">24.3 组成变化不等于菌群失衡</text>
<text x="30" y="100.5" font-size="23" fill="#52685f" font-weight="400">健康后果与因果关系，是判断的关键</text>
<rect x="26" y="161.85" width="628" height="160" rx="15" fill="#ffffff" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="198.85" font-size="26" fill="#176c55" font-weight="700">稳态</text>
<text x="47" y="241.85" font-size="24" fill="#193a30" font-weight="400">微生物群落存在，宿主组织保持健康。</text>
<text x="47" y="276.85" font-size="24" fill="#193a30" font-weight="400">稳定并不要求每个成员比例永远不变。</text>
<rect x="26" y="343.85" width="628" height="160" rx="15" fill="#ffffff" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="380.85" font-size="26" fill="#315f91" font-weight="700">组成发生变化</text>
<text x="47" y="423.85" font-size="24" fill="#193a30" font-weight="400">可能反映组织发育、营养或环境差异。</text>
<text x="47" y="458.85" font-size="24" fill="#193a30" font-weight="400">仅凭多样性或某个类群比例，还不能判断健康。</text>
<rect x="26" y="525.85" width="628" height="160" rx="15" fill="#fff7e8" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="562.85" font-size="26" fill="#176c55" font-weight="700">与宿主损伤有关的失衡</text>
<text x="47" y="605.85" font-size="24" fill="#193a30" font-weight="400">结合群落数量、成员构成与组织健康。</text>
<text x="47" y="640.85" font-size="24" fill="#193a30" font-weight="400">仍要区分：群落引起损伤，还是损伤改变群落？</text>
<rect x="26" y="707.85" width="628" height="160" rx="15" fill="#ffffff" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="744.85" font-size="26" fill="#176c55" font-weight="700">因果判断需要补上的证据</text>
<text x="47" y="787.85" font-size="24" fill="#193a30" font-weight="400">时间关系、宿主背景和功能比较相互约束。</text>
<text x="47" y="822.85" font-size="24" fill="#193a30" font-weight="400">同一张群落组成图，不能独自完成这些判断。</text>
<text x="32" y="903.85" font-size="22" fill="#52685f" font-weight="400">原创教学示意；具体来源与适用范围见本章图注。</text>
</svg>
