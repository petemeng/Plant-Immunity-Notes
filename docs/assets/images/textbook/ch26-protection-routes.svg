<svg xmlns="http://www.w3.org/2000/svg" width="680" height="965" viewBox="0 0 680 965" role="img" aria-labelledby="title desc"><title id="title">26.1 保护植物，可以经过不同路径</title><desc id="desc">宿主介导免疫、直接生态抑制和营养改善不应混作一种机制。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="680" height="965" fill="#f8faf6"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#718d7d"/></marker></defs>
<text x="30" y="45" font-size="30" fill="#193a30" font-weight="700">26.1 保护植物，可以经过不同路径</text>
<text x="30" y="100.5" font-size="23" fill="#52685f" font-weight="400">同一互作可能同时贡献多个过程</text>
<rect x="26" y="161.85" width="628" height="160" rx="15" fill="#ffffff" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="198.85" font-size="26" fill="#176c55" font-weight="700">宿主介导的诱导抗性</text>
<text x="47" y="241.85" font-size="24" fill="#193a30" font-weight="400">根部互作改变宿主响应状态。</text>
<text x="47" y="276.85" font-size="24" fill="#193a30" font-weight="400">远端组织在后续挑战中出现相应保护。</text>
<rect x="26" y="343.85" width="628" height="160" rx="15" fill="#ffffff" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="380.85" font-size="26" fill="#315f91" font-weight="700">直接生态抑制</text>
<text x="47" y="423.85" font-size="24" fill="#193a30" font-weight="400">资源、空间及微生物互作影响病原压力。</text>
<text x="47" y="458.85" font-size="24" fill="#193a30" font-weight="400">群落抑病本身不自动证明ISR。</text>
<rect x="26" y="525.85" width="628" height="160" rx="15" fill="#ffffff" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="562.85" font-size="26" fill="#176c55" font-weight="700">营养或生长改善</text>
<text x="47" y="605.85" font-size="24" fill="#193a30" font-weight="400">改善资源利用，可能增加生物量。</text>
<text x="47" y="640.85" font-size="24" fill="#193a30" font-weight="400">长得更大，不能单独证明抗病性增强。</text>
<rect x="26" y="707.85" width="628" height="160" rx="15" fill="#fff7e8" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="744.85" font-size="26" fill="#176c55" font-weight="700">分别读取终点</text>
<text x="47" y="787.85" font-size="24" fill="#193a30" font-weight="400">病原负荷、症状、组织功能和生长/产量</text>
<text x="47" y="822.85" font-size="24" fill="#193a30" font-weight="400">相同终点也可能来自不同作用路径。</text>
<text x="32" y="903.85" font-size="22" fill="#52685f" font-weight="400">原创教学示意；具体来源与适用范围见本章图注。</text>
</svg>
