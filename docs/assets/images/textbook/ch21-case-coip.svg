<text x="47" y="702.65" font-size="26" fill="#176c55" font-weight="700">甲：输入与捕获近似，B共沉淀更多</text>
<text x="47" y="745.65" font-size="24" fill="#193a30" font-weight="400">支持关联读数发生变化，仍不能从条带确定亲和力。</text>
<rect x="26" y="812.65" width="628" height="160" rx="15" fill="#ffffff" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="849.65" font-size="26" fill="#315f91" font-weight="700">乙与丙：另有同步变化</text>
<text x="47" y="892.65" font-size="24" fill="#193a30" font-weight="400">乙捕获到更多A；丙起始样本中的B更多。</text>
<text x="47" y="927.65" font-size="24" fill="#193a30" font-weight="400">二者的IP B增量都不能单独归于结合增强。</text>
<text x="32" y="1008.65" font-size="22" fill="#52685f" font-weight="400">第5泳道只有游离GFP，没有A-GFP；游离GFP在Input和IP中</text>
<text x="32" y="1040.55" font-size="22" fill="#52685f" font-weight="400">均可检出。“—”不是零值。不能用跨行原始信号换算分子比例。</text>
<text x="32" y="1104.45" font-size="22" fill="#52685f" font-weight="400">原创教学示意；具体来源与适用范围见本章图注。</text>
