<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1146" viewBox="0 0 680 1146" role="img" aria-labelledby="title desc"><title id="title">22.3 Dual-LUC：把比值拆回原始读数</title><desc id="desc">A至D的比值都为四，是基准二的两倍；但LUC分别增加、不变、增加和减少。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="680" height="1146" fill="#f8faf6"/>
