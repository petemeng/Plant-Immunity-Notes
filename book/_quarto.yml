project:
  type: book
  output-dir: _book

book:
  title: "植物免疫知识书"
  subtitle: "从文献笔记到可演化知识体系"
  author: "Peter"
  date: today
  chapters:
    - index.qmd
    - part: "导读"
      chapters:
        - chapters/core-00-roadmap.qmd
    - part: "第一阶段 建立骨架（1-2周）"
      chapters:
        - chapters/core-01-pti.qmd
        - chapters/core-02-eti.qmd
        - chapters/core-03-pti-eti-synergy.qmd
    - part: "第二阶段 填充血肉：三大核心模块（1-2个月）"
      chapters:
        - chapters/core-05-signal-transduction.qmd
        - chapters/core-06-hormone-network.qmd
        - chapters/core-08-spatiotemporal-regulation.qmd
        - chapters/core-09-systemic-immunity.qmd
    - part: "第三阶段 掌握兵法：效应子生物学（持续学习）"
      chapters:
        - chapters/core-04-effector-biology.qmd
        - chapters/core-07-proteostasis-autophagy.qmd
        - chapters/core-10-evolution-diversity.qmd
    - part: "第四阶段 实验技能：从理论到实操"
      chapters:
        - chapters/core-11-methodology.qmd
        - chapters/core-12-data-reproducibility.qmd
    - part: "第五阶段 前沿与创新：从机制到转化"
      chapters:
        - chapters/core-13-crop-translation.qmd
        - chapters/core-14-frontiers.qmd
    - part: "附录 现有沉淀"
      chapters:
        - chapters/01-immune-overview.qmd
        - chapters/02-eti-nlr.qmd
        - chapters/03-avrptob-case.qmd
        - chapters/04-experimental-design.qmd
        - chapters/05-rboh-signaling.qmd
        - knowledge/knowledge-points.qmd
        - knowledge/literature-evidence-table.qmd
        - knowledge/raw-notes.qmd
        - chapters/06-maintenance-workflow.qmd

bibliography: references.bib
lang: zh

format:
  html:
    theme: flatly
    toc:
      collapse: section
      sidebar: left
      smooth-scroll: true
    number-sections: true
    code-copy: true
    css: styles.css
    include-in-header:
      - text: |
          <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
          <style>
            /* 左侧导航栏样式 */
            .sidebar nav[role="doc-toc"] {
              padding: 1rem;
            }
            .sidebar nav[role="doc-toc"] h2 {
              font-size: 0.9rem;
              font-weight: 600;
              color: #1a472a;
              margin-bottom: 0.8rem;
            }
            .sidebar nav[role="doc-toc"] ul {
              padding-left: 0;
            }
            .sidebar nav[role="doc-toc"] li {
              margin: 0.3rem 0;
            }
            .sidebar nav[role="doc-toc"] a {
              color: #2c2c2c;
              font-size: 0.88rem;
              padding: 0.3rem 0.5rem;
              border-radius: 4px;
              display: block;
            }
            .sidebar nav[role="doc-toc"] a:hover {
              background: #e8f5e9;
              color: #1a472a;
            }
            .sidebar nav[role="doc-toc"] a.active {
              background: #e8f5e9;
              color: #2d7a4f;
              font-weight: 600;
              border-left: 3px solid #2d7a4f;
            }
            /* 隐藏默认的右侧 TOC，使用章节内 TOC */
            .toc-contents {
              display: none;
            }
          </style>
    html-math-method: katex

execute:
  freeze: auto
