<svg xmlns="http://www.w3.org/2000/svg" width="680" height="965" viewBox="0 0 680 965" role="img" aria-labelledby="title desc"><title id="title">24.1 同一株植物，多种微生物环境</title><desc id="desc">根际、根表、根内与叶表、叶内是不同生态区室；空间联系不等于必经定殖流程。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="680" height="965" fill="#f8faf6"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#718d7d"/></marker></defs>
<text x="30" y="45" font-size="30" fill="#193a30" font-weight="700">24.1 同一株植物，多种微生物环境</text>
<text x="30" y="100.5" font-size="23" fill="#52685f" font-weight="400">先定位在哪里，再讨论如何共处</text>
<rect x="26" y="161.85" width="628" height="230" rx="15" fill="#ffffff" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="198.85" font-size="26" fill="#176c55" font-weight="700">根部：从来源环境到宿主内部</text>
<text x="47" y="241.85" font-size="24" fill="#193a30" font-weight="400">土壤：提供潜在成员的来源库</text>
<text x="47" y="276.85" font-size="24" fill="#193a30" font-weight="400">根际：根活动改变周围资源与化学环境</text>
<text x="47" y="311.85" font-size="24" fill="#193a30" font-weight="400">根表：与植物表面接触</text>
<text x="47" y="346.85" font-size="24" fill="#193a30" font-weight="400">根内：内部组织具有不同约束</text>
<rect x="26" y="413.85" width="304" height="143" rx="15" fill="#eef5ef" stroke="#d4e3d9" stroke-width="2"/>
<text x="46" y="450.85" font-size="25" fill="#176c55" font-weight="700">叶表</text>
<text x="46" y="492.85" font-size="23" fill="#193a30" font-weight="400">暴露于空气和外界输入</text>
<text x="46" y="526.2" font-size="23" fill="#193a30" font-weight="400">水分、光照等不断变化</text>
<rect x="350" y="413.85" width="304" height="143" rx="15" fill="#eef3f9" stroke="#d4e3d9" stroke-width="2"/>
<text x="370" y="450.85" font-size="25" fill="#315f91" font-weight="700">叶内</text>
<text x="370" y="492.85" font-size="23" fill="#193a30" font-weight="400">存在于组织内部的空间</text>
<text x="370" y="526.2" font-size="23" fill="#193a30" font-weight="400">受宿主生理与免疫调节</text>
<rect x="26" y="576.85" width="628" height="195" rx="15" fill="#fff7e8" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="613.85" font-size="26" fill="#176c55" font-weight="700">为什么区室必须分清？</text>
<text x="47" y="656.85" font-size="24" fill="#193a30" font-weight="400">整根或整叶的平均值，会混合不同位置的信息。</text>
<text x="47" y="691.85" font-size="24" fill="#193a30" font-weight="400">在一个区室检测到成员，不等于它在所有位置都活</text>
<text x="47" y="726.85" font-size="24" fill="#193a30" font-weight="400">跃。</text>
<text x="32" y="807.85" font-size="22" fill="#52685f" font-weight="400">定殖不等于致病。这里比较空间环境，未表示所有微生物沿同</text>
<text x="32" y="839.75" font-size="22" fill="#52685f" font-weight="400">一路线进入植物。</text>
<text x="32" y="903.65" font-size="22" fill="#52685f" font-weight="400">原创教学示意；具体来源与适用范围见本章图注。</text>
</svg>
