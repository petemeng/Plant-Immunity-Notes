<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1020" viewBox="0 0 720 1020" role="img" aria-labelledby="title desc">
<title id="title">ZAR1：从结构到通道，差了哪一步</title><desc id="desc">2015年宿主状态识别，2019年活化五聚体，2021年离子通道证据。示意圆圈不代表原子结构。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#627e72"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif} .heading{font-weight:700}</style>
<rect width="720" height="1020" fill="#f7faf7"/>
<text x="36" y="53" font-size="31" fill="#19372f" text-anchor="start" class="heading">ZAR1：从结构到通道，差了哪一步</text>
<text x="36" y="90" font-size="22" fill="#50655e" text-anchor="start" class="body">形状提出假说，功能证据决定怎样解释形状</text>
<rect x="30" y="121" width="660" height="218" rx="16" fill="#ffffff" stroke="#d6e3da" stroke-width="2"/>
<text x="51" y="162" font-size="26" fill="#18755e" text-anchor="start" class="heading">2015  输入与伙伴分工</text>
<text x="51" y="205" font-size="24" fill="#19372f" text-anchor="start" class="body">PBL2的特定状态：被读取的宿主信息</text>
<text x="51" y="241" font-size="24" fill="#19372f" text-anchor="start" class="body">RKS1：连接状态读取与受体变化</text>
<text x="51" y="277" font-size="24" fill="#19372f" text-anchor="start" class="body">ZAR1：受体活化与执行装配</text>
<path d="M360,340 L360,364" fill="none" stroke="#627e72" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="30" y="376" width="660" height="250" rx="16" fill="#ffffff" stroke="#d6e3da" stroke-width="2"/>
<text x="51" y="418" font-size="26" fill="#18755e" text-anchor="start" class="heading">2019  活化后形成五聚体</text>
<circle cx="136.0" cy="452.0" r="25" fill="#18755e"/>
<circle cx="192.11233446141406" cy="492.7679973318781" r="25" fill="#18755e"/>
<circle cx="170.67932988525592" cy="558.7320026681219" r="25" fill="#18755e"/>
<circle cx="101.32067011474409" cy="558.7320026681219" r="25" fill="#18755e"/>
<circle cx="79.88766553858594" cy="492.7679973318781" r="25" fill="#18755e"/>
<text x="136" y="606" font-size="21" fill="#50655e" text-anchor="middle" class="body">五聚体示意</text>
<text x="248" y="476" font-size="23" fill="#19372f" text-anchor="start" class="body">氨基端重排，出现漏斗状组织</text>
<text x="248" y="515" font-size="23" fill="#19372f" text-anchor="start" class="body">提供可能作用于膜的结构依据</text>
<text x="248" y="554" font-size="23" fill="#19372f" text-anchor="start" class="body">但尚未直接测到离子电流。</text>
<path d="M360,628 L360,652" fill="none" stroke="#627e72" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="30" y="664" width="660" height="243" rx="16" fill="#ffffff" stroke="#d6e3da" stroke-width="2"/>
<text x="51" y="707" font-size="26" fill="#18755e" text-anchor="start" class="heading">2021  通道功能获得独立证据</text>
<text x="51" y="752" font-size="23" fill="#19372f" text-anchor="start" class="body">膜中组织 + 电生理 + 植物功能相互支持</text>
<text x="51" y="788" font-size="23" fill="#19372f" text-anchor="start" class="body">活化ZAR1五聚体：钙通透的阳离子通道</text>
<text x="51" y="824" font-size="23" fill="#19372f" text-anchor="start" class="body">“钙通透”不表示只能让钙离子通过。</text>
<text x="51" y="860" font-size="23" fill="#19372f" text-anchor="start" class="body">一个ZAR1范例不决定全部NLR的工作方式。</text>
<text x="36" y="963" font-size="20" fill="#50655e" text-anchor="start" class="body">原创概念图；圆圈仅表示亚基数目，不是实验结构。</text>
<text x="36" y="992" font-size="20" fill="#50655e" text-anchor="start" class="body">分别对应2015、2019与2021年原始研究。</text>
</svg>
