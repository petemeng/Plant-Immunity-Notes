<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1050" viewBox="0 0 720 1050" role="img" aria-labelledby="title desc">
<title id="title">NPR1：位置、伙伴与状态共同决定功能</title><desc id="desc">核内NPR1与TGA转录因子共同调节表达；2022年结构显示NPR1二聚体连接两个TGA3二聚体。胞质SINCs联系蛋白稳态和细胞存活。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#627e72"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif} .heading{font-weight:700}</style>
<rect width="720" height="1050" fill="#f7faf7"/>
<text x="36" y="53" font-size="31" fill="#19372f" text-anchor="start" class="heading">NPR1：位置、伙伴与状态共同决定功能</text>
<text x="36" y="90" font-size="22" fill="#50655e" text-anchor="start" class="body">核内与胞质是不同工作背景，不是一条固定转换路线</text>
<rect x="30" y="122" width="660" height="374" rx="16" fill="#edf2f8" stroke="#d6e3da" stroke-width="2"/>
<text x="52" y="167" font-size="29" fill="#315d97" text-anchor="start" class="heading">核内：转录共调控</text>
<text x="52" y="208" font-size="22" fill="#19372f" text-anchor="start" class="body">2022年结构：NPR1二聚体连接两个TGA3二聚体。</text>
<text x="52" y="242" font-size="22" fill="#19372f" text-anchor="start" class="body">NPR1提供协作组织，TGA承担DNA识别相关任务。</text>
<rect x="47" y="279" width="152" height="84" rx="16" fill="#ffffff" stroke="#d6e3da" stroke-width="2"/>
<circle cx="103" cy="306" r="14" fill="#315d97"/>
<circle cx="143" cy="306" r="14" fill="#315d97"/>
<text x="123" y="348" font-size="22" fill="#315d97" text-anchor="middle" class="heading">TGA3×2</text>
<rect x="284" y="279" width="152" height="84" rx="16" fill="#ffffff" stroke="#d6e3da" stroke-width="2"/>
<circle cx="340" cy="306" r="14" fill="#18755e"/>
<circle cx="380" cy="306" r="14" fill="#18755e"/>
<text x="360" y="348" font-size="22" fill="#18755e" text-anchor="middle" class="heading">NPR1×2</text>
<rect x="521" y="279" width="152" height="84" rx="16" fill="#ffffff" stroke="#d6e3da" stroke-width="2"/>
<circle cx="577" cy="306" r="14" fill="#315d97"/>
<circle cx="617" cy="306" r="14" fill="#315d97"/>
<text x="597" y="348" font-size="22" fill="#315d97" text-anchor="middle" class="heading">TGA3×2</text>
<path d="M199,321 L284,321 M436,321 L521,321" stroke="#627e72" stroke-width="4"/>
<text x="52" y="409" font-size="22" fill="#19372f" text-anchor="start" class="body">核定位与伙伴关系，仍需与SA响应和周转相结合。</text>
<text x="52" y="444" font-size="22" fill="#19372f" text-anchor="start" class="body">功能性二聚体不能被“活化后永远是单体”概括。</text>
<rect x="30" y="525" width="660" height="252" rx="16" fill="#e2f0e8" stroke="#d6e3da" stroke-width="2"/>
<text x="52" y="570" font-size="29" fill="#18755e" text-anchor="start" class="heading">胞质：SINCs与蛋白稳态</text>
<text x="52" y="614" font-size="23" fill="#19372f" text-anchor="start" class="body">2020年研究将SA诱导的NPR1凝聚体</text>
<text x="52" y="651" font-size="23" fill="#19372f" text-anchor="start" class="body">与Cullin3相关底物调控和细胞存活联系。</text>
<text x="52" y="688" font-size="23" fill="#19372f" text-anchor="start" class="body">看见斑点只是起点，还要解释组成和生理功能。</text>
<text x="52" y="725" font-size="23" fill="#19372f" text-anchor="start" class="body">这一角色扩展了以核内转录为中心的早期模型。</text>
<rect x="30" y="807" width="660" height="127" rx="16" fill="#fff6e8" stroke="#ead7b8" stroke-width="2"/>
<text x="52" y="849" font-size="25" fill="#a56820" text-anchor="start" class="heading">阅读历史模型时，先确认所测的“状态”</text>
<text x="52" y="889" font-size="22" fill="#19372f" text-anchor="start" class="body">提取后的高分子条带、功能性二聚体和凝聚体，</text>
<text x="52" y="921" font-size="22" fill="#19372f" text-anchor="start" class="body">是不同证据对象，不能仅按“聚集”一词合并。</text>
<text x="36" y="993" font-size="20" fill="#50655e" text-anchor="start" class="body">原创概念图；未表达所有复合体、转录步骤或SA依赖关系。</text>
<text x="36" y="1022" font-size="20" fill="#50655e" text-anchor="start" class="body">2026年MED15A相关进展及不同团队贡献见正文。</text>
</svg>
