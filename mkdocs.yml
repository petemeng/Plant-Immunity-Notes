site_name: Plant Immunity Book
site_description: 植物免疫与微生物互作
site_author: Peter
site_url: https://petemeng.github.io/Plant-Immunity-Notes/
repo_url: https://github.com/petemeng/Plant-Immunity-Notes
repo_name: petemeng/Plant-Immunity-Notes

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/book-chapter.v2.css

extra_javascript:
  - assets/javascripts/chapter-toc.v2.js

nav:
  - 前言: index.md
  - Part 1 免疫骨架:
      - ch01 植物免疫全景: part1-免疫骨架/ch01-植物免疫全景.md
      - ch02 PTI与ETI的关系演变: part1-免疫骨架/ch02-PTI与ETI的关系演变.md
  - Part 2 分子机制:
      - ch03 受体与信号转导: part2-分子机制/ch03-受体与信号转导.md
      - ch04 NLR与抗病小体: part2-分子机制/ch04-NLR与抗病小体.md
      - ch05 激素信号网络: part2-分子机制/ch05-激素信号网络.md
      - ch06 免疫的进化: part2-分子机制/ch06-免疫的进化.md
  - Part 3 攻防博弈:
      - ch07 效应子的攻击策略: part3-攻防博弈/ch07-效应子的攻击策略.md
      - ch08 植物的识别智慧: part3-攻防博弈/ch08-植物的识别智慧.md
      - ch09 病原体宿主协同进化: part3-攻防博弈/ch09-病原体宿主协同进化.md
  - Part 4 交叉前沿:
      - ch10 植物微生物组与免疫: part4-交叉前沿/ch10-植物微生物组与免疫.md
      - ch11 免疫与发育的权衡: part4-交叉前沿/ch11-免疫与发育的权衡.md
      - ch12 环境因子与免疫: part4-交叉前沿/ch12-环境因子与免疫.md
      - ch13 非编码RNA与免疫调控: part4-交叉前沿/ch13-非编码RNA与免疫调控.md
  - Part 5 转化与展望:
      - ch14 从基础到抗病育种: part5-转化与展望/ch14-从基础到抗病育种.md
      - ch15 微生物组工程与生物防治: part5-转化与展望/ch15-微生物组工程与生物防治.md
      - ch16 未解决的问题与未来方向: part5-转化与展望/ch16-未解决的问题与未来方向.md
  - Appendix:
      - 术语表: appendix/术语表.md
      - 模式植物与模式病原体索引: appendix/模式植物与模式病原体索引.md
      - 推荐阅读与经典文献指引: appendix/推荐阅读与经典文献指引.md
