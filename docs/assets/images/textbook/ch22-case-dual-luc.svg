<text text-anchor="middle" x="316.5" y="588.35" font-size="23" fill="#193a30" font-weight="400">125</text>
<rect x="384" y="541.85" width="150" height="76" rx="0" fill="#edf4ef" stroke="#d4e3d9" stroke-width="1"/>
<text text-anchor="middle" x="459.0" y="588.35" font-size="23" fill="#193a30" font-weight="400">4</text>
<rect x="534" y="541.85" width="120" height="76" rx="0" fill="#edf4ef" stroke="#d4e3d9" stroke-width="1"/>
