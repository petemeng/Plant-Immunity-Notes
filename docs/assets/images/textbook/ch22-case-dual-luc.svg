<text x="30" y="45" font-size="30" fill="#193a30" font-weight="700">22.3 Dual-LUC：把比值拆回原始读数</text>
<text x="30" y="100.5" font-size="23" fill="#52685f" font-weight="400">虚构算术例；LUC与REN均为任意单位</text>
