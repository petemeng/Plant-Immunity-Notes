<svg xmlns="http://www.w3.org/2000/svg" width="680" height="965" viewBox="0 0 680 965" role="img" aria-labelledby="title desc"><title id="title">27.1 每一类测量回答不同问题</title><desc id="desc">群落组成、编码潜力、活性与宿主功能是不同证据对象，需要分别解释。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="680" height="965" fill="#f8faf6"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#718d7d"/></marker></defs>
<text x="30" y="45" font-size="30" fill="#193a30" font-weight="700">27.1 每一类测量回答不同问题</text>
<text x="30" y="100.5" font-size="23" fill="#52685f" font-weight="400">更多数据，不会自动把相关变成因果</text>
<rect x="26" y="161.85" width="628" height="160" rx="15" fill="#ffffff" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="198.85" font-size="26" fill="#176c55" font-weight="700">组成：检测到了谁？</text>
<text x="47" y="241.85" font-size="24" fill="#193a30" font-weight="400">标记序列、分类及相对丰度</text>
<text x="47" y="276.85" font-size="24" fill="#193a30" font-weight="400">ASV是序列变体，不自动等于一个菌株。</text>
<rect x="26" y="343.85" width="628" height="160" rx="15" fill="#ffffff" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="380.85" font-size="26" fill="#176c55" font-weight="700">潜力：可能具有什么能力？</text>
<text x="47" y="423.85" font-size="24" fill="#193a30" font-weight="400">宏基因组揭示群落携带的基因。</text>
<text x="47" y="458.85" font-size="24" fill="#193a30" font-weight="400">有相关基因，不等于它正在发挥作用。</text>
<rect x="26" y="525.85" width="628" height="160" rx="15" fill="#ffffff" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="562.85" font-size="26" fill="#176c55" font-weight="700">活性：当时有哪些过程发生？</text>
<text x="47" y="605.85" font-size="24" fill="#193a30" font-weight="400">RNA、蛋白、代谢物及空间证据</text>
<text x="47" y="640.85" font-size="24" fill="#193a30" font-weight="400">表达或积累仍不直接等于反应速率与因果作用。</text>
<rect x="26" y="707.85" width="628" height="160" rx="15" fill="#e6f1e9" stroke="#d4e3d9" stroke-width="2"/>
<text x="47" y="744.85" font-size="26" fill="#176c55" font-weight="700">宿主功能：植物因此改变了吗？</text>
<text x="47" y="787.85" font-size="24" fill="#193a30" font-weight="400">负荷、健康、营养、生长与对应功能比较</text>
<text x="47" y="822.85" font-size="24" fill="#193a30" font-weight="400">需要把测量对象、干预关系和适用背景接起来。</text>
<text x="32" y="903.85" font-size="22" fill="#52685f" font-weight="400">原创教学示意；具体来源与适用范围见本章图注。</text>
</svg>
