<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1166" viewBox="0 0 680 1166" role="img" aria-labelledby="title desc"><title id="title">21.2 Co-IP：逐泳道检查输入与捕获</title><desc id="desc">五泳道分别为基准、甲、乙、丙和GFP标签对照；甲伙伴富集增加，乙诱饵捕获增加，丙伙伴输入增加。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="680" height="1166" fill="#f8faf6"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#718d7d"/></marker></defs>
<text x="30" y="45" font-size="30" fill="#193a30" font-weight="700">21.2 Co-IP：逐泳道检查输入与捕获</text>
<text x="30" y="100.5" font-size="23" fill="#52685f" font-weight="400">虚构教学读数；各行仅在同行内比较</text>
<text x="32" y="175.85" font-size="22" fill="#52685f" font-weight="400">捕获：anti-GFP；检测：A-GFP或B-HA。表中数字是任意单</text>
<text x="32" y="207.75" font-size="22" fill="#52685f" font-weight="400">位，非免疫印迹照片。</text>
