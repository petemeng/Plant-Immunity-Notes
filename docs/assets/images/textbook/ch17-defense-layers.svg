<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">结构、信号和代谢共同维持植物组织边界</title>
  <desc id="desc">外部线索通过角质层和气孔影响质外体，质膜感知连接细胞内调节，再改变局部细胞壁、化学防御与气孔。反馈说明屏障会被持续调节。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10Z" fill="#47616b"/></marker>
    <marker id="feedback" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10Z" fill="#a87538"/></marker>
    <style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#223e46} .main{font-size:23px;font-weight:600} .sub{font-size:19px;fill:#4d6269} .note{font-size:17px;fill:#71624b} .box{stroke-width:2} .flow{fill:none;stroke:#47616b;stroke-width:2.5;marker-end:url(#arrow)} .back{fill:none;stroke:#a87538;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#feedback)}</style>
  </defs>
  <rect width="1100" height="850" rx="20" fill="#fbfcfa"/>
  <text x="550" y="40" text-anchor="middle" class="main">屏障是可调节的组织界面</text>
  <rect class="box" x="370" y="65" width="360" height="70" rx="13" fill="#e7efed" stroke="#668a83"/>
  <text x="550" y="107" text-anchor="middle" class="main">外部环境与微生物线索</text>
  <path class="flow" d="M470 135V161H315V185"/>
  <path class="flow" d="M630 135V161H805V185"/>
  <rect class="box" x="150" y="185" width="330" height="86" rx="13" fill="#f7edda" stroke="#bd9a60"/>
  <text x="315" y="220" text-anchor="middle" class="main">角质层</text><text x="315" y="250" text-anchor="middle" class="sub">控制表面交换</text>
  <rect class="box" x="640" y="185" width="330" height="86" rx="13" fill="#f7edda" stroke="#bd9a60"/>
  <text x="805" y="220" text-anchor="middle" class="main">气孔</text><text x="805" y="250" text-anchor="middle" class="sub">可调节的组织开口</text>
  <path class="flow" d="M315 271V299H475V320"/><path class="flow" d="M805 271V299H625V320"/>
  <rect class="box" x="330" y="320" width="440" height="78" rx="13" fill="#eaf3f4" stroke="#71969f"/>
  <text x="550" y="352" text-anchor="middle" class="main">质外体</text><text x="550" y="380" text-anchor="middle" class="sub">细胞壁与细胞间隙</text>
  <path class="flow" d="M550 398V430"/>
  <rect class="box" x="330" y="430" width="440" height="70" rx="13" fill="#eaf3f4" stroke="#71969f"/>
  <text x="550" y="472" text-anchor="middle" class="main">质膜上的感知与运输系统</text>
  <path class="flow" d="M550 500V532"/>
  <rect class="box" x="330" y="532" width="440" height="70" rx="13" fill="#e7efed" stroke="#668a83"/>
  <text x="550" y="574" text-anchor="middle" class="main">细胞内信号与代谢调节</text>
  <path class="flow" d="M470 602V642H210V688"/><path class="flow" d="M550 602V688"/><path class="flow" d="M630 602V642H890V688"/>
  <rect class="box" x="60" y="688" width="300" height="86" rx="13" fill="#edf0e2" stroke="#8d9c65"/>
  <text x="210" y="724" text-anchor="middle" class="main">局部细胞壁重塑</text><text x="210" y="753" text-anchor="middle" class="sub">胼胝质与木质化</text>
  <rect class="box" x="400" y="688" width="300" height="86" rx="13" fill="#edf0e2" stroke="#8d9c65"/>
  <text x="550" y="724" text-anchor="middle" class="main">化学防御与分泌</text><text x="550" y="753" text-anchor="middle" class="sub">改变局部环境</text>
  <rect class="box" x="740" y="688" width="300" height="86" rx="13" fill="#edf0e2" stroke="#8d9c65"/>
  <text x="890" y="724" text-anchor="middle" class="main">保卫细胞状态改变</text><text x="890" y="753" text-anchor="middle" class="sub">重新调节气孔</text>
  <path class="back" d="M60 730H30V360H330"/>
  <text x="165" y="345" text-anchor="middle" class="note">结构反馈</text>
  <path class="back" d="M400 743H385V618H286V385H330"/>
  <text x="263" y="555" text-anchor="end" class="note">化学状态反馈</text>
  <path class="back" d="M1040 730H1070V228H970"/>
  <text x="1035" y="512" text-anchor="middle" class="note" transform="rotate(-90 1035 512)">开口状态反馈</text>
  <text x="550" y="821" text-anchor="middle" class="sub">实线：概念上的影响关系　　虚线：执行后的反馈；并非固定先后流程</text>
</svg>
